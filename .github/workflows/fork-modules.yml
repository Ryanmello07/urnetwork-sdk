# THE FORK'S CHECK OVER EVERY sdk MODULE THAT THE ROOT'S `go test ./...` DOES NOT REACH.
# FORK-ONLY: the upstream branch drops this file (msgrepo ledger 277).
#
# `go test ./...` from the root stops at a Go module boundary. sdk has six go.mod files. The root
# is test.sh's, which fork-ci.yml runs on dispatch (upstream removed test.yml, which ran it on
# push, in 7120b2cf). This job covers the other five:
#   cgo        `go test ./...`: the C ABI, gen's currentness test and upstream's build-contract
#              tests.
#   packaging  the package-manager manifests and the generated language bindings
#   build      the gomobile module: zsh for the three tests that drive test.sh, and a warm module
#              cache for gobind, which its tests run with GOPROXY=off
#   js         under GOOS=js GOARCH=wasm, run by node
#   cgo/build  no code at all: it is the module boundary that build output sits behind
# If a module is added, add it here: this list is what the job claims, and a module missing from
# it is the narrowing the job exists to prevent (items 269 and 277 recorded it twice).
# URmessage's cp3b, livepeer and liveprobe modules and cgo's loopback harness (loopback.go.mod)
# left the sdk for github.com/urnetwork/message with upstream's 13039432 and 7122eb81, so their
# steps left this job with them.
#
# connect is PINNED BY SHA (the split plan's SX-0, red-team finding R2-F6), so a change on
# connect's branch cannot turn this job red. Move a pin only by a commit here, to a SHA this job
# has passed against; clone_at refuses anything but a full SHA.
#   connect         urnetwork/connect, upstream's main at the sync (847460bb): it carries the
#                   establish hold (#217), and the synced sdk needs its newer connect API
#                   (ClientLimitStatus, ClientAuth.ProvideIntent), which the previous pin
#                   (501c172d) does not have.
name: Fork - every sdk module

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    name: cgo, packaging, build, js
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out sdk
        uses: actions/checkout@v4

      - name: Check out the siblings the modules replace to
        run: |
          set -eu
          # clone_at <url> <full sha> <dir>: fetch exactly that commit and check it out, then
          # assert HEAD is it, so a branch name or a short SHA can never stand in for a pin.
          clone_at() {
            git init -q "$3"
            git -C "$3" fetch -q --depth 1 "$1" "$2"
            git -C "$3" checkout -q --detach FETCH_HEAD
            test "$(git -C "$3" rev-parse HEAD)" = "$2"
            echo "$3 pinned at $2"
          }
          clone_at https://github.com/urnetwork/connect.git 847460bba8aa31fb2e86ce007e9d5443d884544b ../connect
          git clone --depth 1 https://github.com/urnetwork/glog.git ../glog
          git clone --depth 1 https://github.com/urnetwork/goidenticons.git ../goidenticons
          git clone --depth 1 --branch go https://github.com/urnetwork/gvisor.git ../gvisor
          git clone --depth 1 --filter=blob:none --sparse https://github.com/urnetwork/server.git ../server
          git -C ../server sparse-checkout set api

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cgo/go.mod

      # Each step runs even when an earlier one failed, so one red module never hides another.
      - name: cgo (cgo, gen, buildcontract)
        if: always()
        working-directory: cgo
        run: go test ./... -count=1 -timeout 30m

      - name: packaging
        if: always()
        working-directory: packaging
        run: go test ./... -count=1 -timeout 20m

      - name: build (the gomobile module)
        if: always()
        working-directory: build
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          # mobileexports runs gobind with GOPROXY=off, so the cache must already hold x/mobile
          go mod download
          go test ./... -count=1 -timeout 20m

      - name: js (GOOS=js GOARCH=wasm, under node)
        if: always()
        working-directory: js
        env:
          GOOS: js
          GOARCH: wasm
          GOEXPERIMENT: greenteagc
        run: |
          set -eu
          go vet ./...
          go test ./... -count=1 -timeout 20m -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec"
